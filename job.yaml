resources:
  jobs:
    cinedata_pipeline:
      name: cinedata pipeline
      schedule:
        quartz_cron_expression: 33 0 6 * * ?
        timezone_id: America/Sao_Paulo
        pause_status: UNPAUSED
      tasks:
        - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/enzoyhirotani@gmail.com/RL_atividade2/Landing_to_Bronze
            source: WORKSPACE
        - task_key: to_silver
          depends_on:
            - task_key: to_Bronze
          notebook_task:
            notebook_path: /Workspace/Users/enzoyhirotani@gmail.com/RL_atividade2/Bronze_to_Silver
            source: WORKSPACE
        - task_key: to_Gold
          depends_on:
            - task_key: to_silver
          notebook_task:
            notebook_path: /Workspace/Users/enzoyhirotani@gmail.com/RL_atividade2/Silver_to_Gold
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
